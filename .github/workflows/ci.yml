name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      # Code-quality gates only. These do NOT build the warehouse (that fetches
      # dozens of live sources and is done at Docker build time); the test suite
      # stubs the network, so it runs without one.
      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Typecheck (ty)
        run: uv run ty check

      - name: Tests (pytest)
        run: uv run pytest -q

      # dbt project validation: install packages and parse the whole project so
      # bad refs, malformed schema.yml, or missing test macros fail CI. `parse`
      # does not open the warehouse (built at Docker build time), so this stays
      # network-light and fast — the data tests themselves run against a locally
      # built warehouse, not in CI.
      - name: Install dbt packages
        run: uv run dbt deps

      - name: Validate dbt project (parse)
        run: uv run dbt parse --profiles-dir . --no-partial-parse
