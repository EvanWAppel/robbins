# Project-local dbt profile. Run dbt with `--profiles-dir .`
# DuckDB warehouse is a single file (seattle.duckdb) built by build_warehouse.py.
robbins:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: 'seattle.duckdb'
      schema: main
      threads: 4
      # Point-in-polygon joins for the neighborhood choropleths (crime/fire/311
      # assigned to MCPP polygons via ST_Contains). Auto-installed + loaded.
      extensions:
        - spatial
