version: 2

sources:
  - name: raw
    database: seattle
    schema: raw
    tables:
      # Freshness: these three feeds carry a genuine event timestamp, so
      # `dbt source freshness` measures the reporting lag of the upstream open-data
      # portal (max event time vs. now). Raw columns land as text from the CSV/JSON
      # loads, so loaded_at_field is a try_cast expression. Thresholds are generous
      # because municipal feeds publish with real lag — the point is to detect a
      # feed that has gone stale, not to chase same-day currency.
      - name: building_permits
        description: >
          Seattle DCI building permits (Socrata 76t5-zqzr, ~192k rows, 1986-present).
          One row per permit: class, type, estimated project cost, applied/issued/
          completed dates, current status, address, and WGS84 coordinates.
        loaded_at_field: "try_cast(issueddate as timestamp)"
        freshness:
          warn_after: {count: 30, period: day}
          error_after: {count: 90, period: day}
      - name: crime
        description: >
          SPD Crime Data (Socrata tazs-3rd5), capped to recent years via CSV export.
          One row per offense: report/offense datetimes, NIBRS offense category and
          description, block address, neighborhood/beat/precinct, and WGS84 lat/lon.
          Missing geo appears as a '-1.0' sentinel or 'REDACTED' (recent rows).
        loaded_at_field: "try_cast(report_date_time as timestamp)"
        freshness:
          warn_after: {count: 14, period: day}
          error_after: {count: 45, period: day}
      - name: fire_911
        description: >
          Seattle Real-Time Fire 911 dispatch (Socrata kzjm-xkqj), recent years via
          CSV export. One row per dispatch: incident_number, call type, datetime,
          address, and WGS84 latitude/longitude (all text from the CSV load).
      - name: csr_311
        description: >
          Seattle Customer Service Requests / Find-It-Fix-It (Socrata 5ngg-rpne),
          capped to 2020-present via CSV export (~1.65M rows). One row per request:
          servicerequestnumber, webintakeservicerequests (request type), departmentname,
          createddate, methodreceivedname (Find It Fix It Apps / web / phone / ...),
          servicerequeststatusname, address, zip, councildistrict, policeprecinct, and
          WGS84 latitude/longitude (all text from the CSV load).
        loaded_at_field: "try_cast(createddate as timestamp)"
        freshness:
          warn_after: {count: 14, period: day}
          error_after: {count: 45, period: day}
      - name: ntd_ridership
        description: >
          Puget Sound monthly transit + ferry ridership (FTA National Transit
          Database, Socrata 8bui-9xvu @ data.transportation.gov), 2015-present,
          curated to the metro's operators. One row per agency/mode/month: agency +
          agency_label (friendly), mode + mode_label (human), is_ferry (mode FB), date
          (month), upt (unlinked passenger trips). Feeds both the Transit and Ferry
          pages — ferry filters is_ferry, transit takes the rest.
      - name: food_inspections
        description: >
          Public Health – Seattle & King County food establishment inspections
          (Socrata r878-4sxa). ONE ROW PER VIOLATION — a clean inspection is one row
          with null violation fields; dedupe on inspection_serial_num for per-
          inspection facts. Non-spatial (address/city/zip only, no lat/lon).
      - name: short_term_rentals
        description: >
          Seattle Short-Term Rental licenses (Socrata s7df-xba4, ~11k). licenseid,
          licensestatus (Active/Inactive/Expired/...), licenseexpirationdate,
          propertytype, geographicregion, and WGS84 lat/lon (~70% populated).
      - name: business_licenses
        description: >
          Active Seattle business license tax certificates (Socrata wnbq-64tb, ~84k).
          business_legal_name, trade_name, ownership_type, naics_code/description,
          license_start_date (YYYYMMDD text — parse with strptime), city/zip. Non-spatial.
      - name: public_art
        description: >
          Seattle Office of Arts & Culture public art (ArcGIS PublicArt2, ~758 points).
          The FIRST ArcGIS-sourced table (vs. Socrata): TITLE, ARTIST_NAM, CLASSIFICA
          (type), MEDIUM, DATED (year, text), LOCATION__; WGS84 latitude/longitude are
          computed from feature geometry at fetch time (the source lat/lon attrs are 0).
      - name: parks
        description: >
          Seattle Parks & Recreation park boundaries (ArcGIS Park_Boundaries, ~511
          rows). Point geometry (one point per park); name, area_sqft (PARKSBND_AREA,
          square feet), WGS84 latitude/longitude from geometry, and is_water_name — a
          name-derived boolean flagging water-associated parks (attached at fetch).
      - name: trees
        description: >
          SDOT active street-tree inventory (ArcGIS SDOT_Trees_(Active), ~212k points).
          scientific_name (full binomial), genus (name-derived at fetch), condition
          (GOOD/FAIR), heritage / exceptional (Y/N), planted_epoch_ms (epoch ms),
          district (council district code), and WGS84 latitude/longitude from geometry.
      - name: weather
        description: >
          Sea-Tac daily weather (NOAA GHCN-Daily station USW00024233, ~28k days,
          1948-present). Wide keyless station CSV; DATE plus GHCN-convention values
          (all space-padded text): PRCP/SNOW/SNWD in tenths-mm or mm, TMAX/TMIN/TAVG
          in tenths of a degree C. Staging divides by 10 and derives inches / °F.
      - name: air_quality
        description: >
          EPA AQS daily PM2.5 + Ozone for the Seattle metro (King/Pierce/Snohomish),
          2019-present, filtered from the keyless national daily bulk files. Only the
          AQI-bearing daily rows are kept (one per monitor/day on each pollutant's
          daily standard). Columns: county/site, lat/lon, date_local, parameter_name,
          arithmetic_mean (µg/m³ for PM2.5, ppm for Ozone), aqi. A few POC dupes per
          site/day are averaged in staging; AQI is the cross-pollutant comparable.
      - name: cedar_river_flow
        description: >
          Cedar River at Renton daily streamflow (USGS NWIS 12119000, param 00060),
          2015-present. obs_date (ISO timestamp text) + value (discharge, cfs, text).
          Seattle's primary drinking-water source. One of three "water" feeds.
      - name: seattle_tides
        description: >
          Seattle (Elliott Bay) monthly tide datums (NOAA CO-OPS 9447130, monthly_mean),
          2000-present. year/month + sea-level datums in feet (MSL, MHHW, MLLW, GT great
          diurnal range, highest/lowest), all text. Drives the sea-level trend.
      - name: snowpack
        description: >
          Stampede Pass daily snowpack (NRCS SNOTEL 791:WA:SNTL), 2015-present.
          obs_date, swe_in (snow water equivalent), snow_depth_in. Water year = Oct 1
          to Sep 30. Peak SWE per water year is the drought signal (2015 collapse).
