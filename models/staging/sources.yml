version: 2

sources:
  - name: raw
    database: seattle
    schema: raw
    tables:
      - name: building_permits
        description: >
          Seattle DCI building permits (Socrata 76t5-zqzr, ~192k rows, 1986-present).
          One row per permit: class, type, estimated project cost, applied/issued/
          completed dates, current status, address, and WGS84 coordinates.
      - name: crime
        description: >
          SPD Crime Data (Socrata tazs-3rd5), capped to recent years via CSV export.
          One row per offense: report/offense datetimes, NIBRS offense category and
          description, block address, neighborhood/beat/precinct, and WGS84 lat/lon.
          Missing geo appears as a '-1.0' sentinel or 'REDACTED' (recent rows).
      - name: fire_911
        description: >
          Seattle Real-Time Fire 911 dispatch (Socrata kzjm-xkqj), recent years via
          CSV export. One row per dispatch: incident_number, call type, datetime,
          address, and WGS84 latitude/longitude (all text from the CSV load).
      - name: food_inspections
        description: >
          Public Health – Seattle & King County food establishment inspections
          (Socrata r878-4sxa). ONE ROW PER VIOLATION — a clean inspection is one row
          with null violation fields; dedupe on inspection_serial_num for per-
          inspection facts. Non-spatial (address/city/zip only, no lat/lon).
      - name: short_term_rentals
        description: >
          Seattle Short-Term Rental licenses (Socrata s7df-xba4, ~11k). licenseid,
          licensestatus (Active/Inactive/Expired/...), licenseexpirationdate,
          propertytype, geographicregion, and WGS84 lat/lon (~70% populated).
      - name: business_licenses
        description: >
          Active Seattle business license tax certificates (Socrata wnbq-64tb, ~84k).
          business_legal_name, trade_name, ownership_type, naics_code/description,
          license_start_date (YYYYMMDD text — parse with strptime), city/zip. Non-spatial.
      - name: public_art
        description: >
          Seattle Office of Arts & Culture public art (ArcGIS PublicArt2, ~758 points).
          The FIRST ArcGIS-sourced table (vs. Socrata): TITLE, ARTIST_NAM, CLASSIFICA
          (type), MEDIUM, DATED (year, text), LOCATION__; WGS84 latitude/longitude are
          computed from feature geometry at fetch time (the source lat/lon attrs are 0).
      - name: weather
        description: >
          Sea-Tac daily weather (NOAA GHCN-Daily station USW00024233, ~28k days,
          1948-present). Wide keyless station CSV; DATE plus GHCN-convention values
          (all space-padded text): PRCP/SNOW/SNWD in tenths-mm or mm, TMAX/TMIN/TAVG
          in tenths of a degree C. Staging divides by 10 and derives inches / °F.
      - name: air_quality
        description: >
          EPA AQS daily PM2.5 + Ozone for the Seattle metro (King/Pierce/Snohomish),
          2019-present, filtered from the keyless national daily bulk files. Only the
          AQI-bearing daily rows are kept (one per monitor/day on each pollutant's
          daily standard). Columns: county/site, lat/lon, date_local, parameter_name,
          arithmetic_mean (µg/m³ for PM2.5, ppm for Ozone), aqi. A few POC dupes per
          site/day are averaged in staging; AQI is the cross-pollutant comparable.
