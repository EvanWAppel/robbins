version: 2

# Marts layer: the analytics-ready tables the Streamlit pages read directly via
# app_db.query(). Each mart is one page's-worth of a chart, map, or KPI — already
# aggregated, filtered, and shaped so the app does no heavy lifting at request time.
# Column descriptions document the exact surface each view consumes.
#
# This file also carries the marts-layer DATA TESTS (cross-layer integrity the
# staging tests can't express): the one-row-per-inspection dedup guard, the map
# samples' relationships back to their staging keys, and metro-bounding-box range
# checks on every mapped point. All verified against the built warehouse first.

models:
  - name: mart_mobility_coverage
    description: >
      Loaded transit/ferry reporting windows by agency and ferry flag. Counts of
      distinct reported months do not imply continuous coverage. Agency-wide
      boardings cannot be allocated to counties or routes from this source.
    columns:
      - name: agency
        description: Exact FTA reporting agency name.
        tests: [not_null]
      - name: agency_label
        description: Friendly agency name; King County ferry records are Water Taxi service.
      - name: is_ferry
        description: True for ferry mode; false for land transit modes.
        tests: [not_null]
      - name: first_month
        description: Earliest loaded reporting month, not retrieval date.
      - name: last_month
        description: Latest loaded reporting month, not retrieval date.
      - name: months_reported
        description: Number of distinct months with non-null ridership reports.
      - name: boardings
        description: Sum of unlinked passenger trips in the loaded period.
  - name: mart_air_observations
    description: >
      Puget Sound monitor/day/pollutant observations with stable EPA site IDs and
      county FIPS. Configured for ten counties; inspect actual loaded coverage
      before claiming regional completeness. Missing observations are not zeros.
      Use this mart for county filters before aggregating daily peaks.
    columns:
      - name: county_fips
        description: Five-digit state/county FIPS; filter here for county comparisons.
        tests: [not_null]
      - name: county
        description: County name reported by EPA.
      - name: site_id
        description: Nine-digit EPA state/county/site identifier.
        tests: [not_null]
      - name: site
        description: EPA local monitor name; names alone are not unique IDs.
      - name: latitude
        description: Monitor latitude in decimal degrees.
      - name: longitude
        description: Monitor longitude in decimal degrees.
      - name: obs_date
        description: Observation date, not retrieval date.
        tests: [not_null]
      - name: pollutant
        description: EPA pollutant name.
      - name: aqi
        description: >
          Rounded average of AQI-bearing source rows per site/day/pollutant. EPA AQI is a unitless 0–500 index; bands: Good ≤50, Moderate ≤100, Unhealthy for Sensitive Groups ≤150, Unhealthy ≤200, Very Unhealthy ≤300, Hazardous >300.
        tests: [not_null]
      - name: aqi_category
        description: >
          Category based on the average AQI before rounding. EPA AQI is a unitless 0–500 index; bands: Good ≤50, Moderate ≤100, Unhealthy for Sensitive Groups ≤150, Unhealthy ≤200, Very Unhealthy ≤300, Hazardous >300.
  # ===== Air quality (EPA AQS) ==============================================
  - name: mart_air_category_days
    description: >
      Count of days in each AQI category, bucketed by the WORST PM2.5 reading
      anywhere in the metro that day, so rare wildfire-smoke days show up instead
      of being averaged away. Drives the air-quality category bar chart.
    columns:
      - name: aqi_category
        description: >
          EPA AQI band (Good … Hazardous). EPA AQI is a unitless 0–500 index; bands: Good ≤50, Moderate ≤100, Unhealthy for Sensitive Groups ≤150, Unhealthy ≤200, Very Unhealthy ≤300, Hazardous >300.
      - name: day_count
        description: Number of metro-days whose worst reading fell in this band.
      - name: severity
        description: 1–6 sort key ordering the bands from Good to Hazardous.

  - name: mart_air_monthly
    description: >
      Monthly average and peak AQI by pollutant across all loaded Puget Sound
      monitors (EPA AQS daily files, years 2019–2026 configured) — surfaces the
      late-summer smoke spikes. One row per month × pollutant.
    columns:
      - name: obs_month
        description: Month (first-of-month date).
      - name: pollutant
        description: >
          EPA AQS parameter_name, verbatim, for parameter 88101 (PM2.5) or 44201
          (Ozone); match with like 'PM2.5%' / like 'Ozone%' rather than equality.
      - name: avg_aqi
        description: >
          Metro-wide mean AQI for the month: unweighted average over every
          site-day row (one per monitor per day) across all loaded Puget Sound
          monitors — not a per-site or population-weighted figure.
      - name: max_aqi
        description: >
          Highest site-day AQI at any loaded monitor in the month.
      - name: reading_count
        description: >
          Number of site-day rows (monitor × day, multiple POCs already averaged) aggregated for the month and pollutant.

  - name: mart_air_sites
    description: One row per stable EPA PM2.5 monitor ID for the map — location plus its average and worst AQI.
    columns:
      - name: site_id
        description: Nine-digit EPA state/county/site identifier; stable across name changes.
        tests: [not_null, unique]
      - name: site
        description: Monitor (local site) name.
      - name: county
        description: County the monitor sits in.
      - name: latitude
        description: Monitor latitude (fixed per site; averaged defensively).
      - name: longitude
        description: Monitor longitude.
      - name: avg_aqi
        description: Mean AQI over the loaded window.
      - name: max_aqi
        description: Worst AQI over the loaded window.
      - name: day_count
        description: Number of days the monitor reported.

  - name: mart_air_worst_days
    description: The metro's 15 worst air days — highest single PM2.5 AQI per date, with the site that recorded it. Almost all smoke days.
    columns:
      - name: obs_date
        description: Calendar date.
      - name: max_aqi
        description: Highest PM2.5 AQI recorded anywhere in the metro that day.
      - name: aqi_category
        description: >
          EPA band for that reading. EPA AQI is a unitless 0–500 index; bands: Good ≤50, Moderate ≤100, Unhealthy for Sensitive Groups ≤150, Unhealthy ≤200, Very Unhealthy ≤300, Hazardous >300.
      - name: site
        description: Monitor that recorded the worst reading.
      - name: county
        description: County of that monitor.

  # ===== Public art (ArcGIS) ================================================
  - name: mart_art_by_type
    description: Artwork counts by classification (sculpture, mural, …); blanks rolled to 'Unknown'.
    columns:
      - name: classification
        description: Artwork type.
      - name: artwork_count
        description: Number of artworks of this type.

  - name: mart_art_points
    description: Geocoded public artworks for the map, clipped to the Seattle-metro bounding box.
    columns:
      - name: title
        description: Artwork title.
      - name: artist
        description: Artist name.
      - name: classification
        description: Artwork type.
      - name: medium
        description: Material / medium.
      - name: dated
        description: Year created (free text from the source).
      - name: location
        description: Sited location description.
      - name: latitude
        description: Artwork latitude (within the metro box).
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 47.0
                max_value: 48.5
      - name: longitude
        description: Artwork longitude.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -122.6
                max_value: -121.5

  # ===== Crime (SPD) ========================================================
  - name: mart_crime_by_category
    description: Offense counts by NIBRS category, most common first.
    columns:
      - name: offense_category
        description: NIBRS offense category.
      - name: incident_count
        description: Number of offenses in the category.

  - name: mart_crime_by_hour_weekday
    description: Hour-of-day × weekday grid behind the crime heatmap.
    columns:
      - name: weekday
        description: Day name (Monday … Sunday).
      - name: hour_of_day
        description: >
          Hour 0–23 extracted from the source report_date_time as published (cast to a timezone-naive timestamp; no timezone conversion in code).
      - name: incident_count
        description: Offenses in that weekday/hour cell.

  - name: mart_crime_monthly
    description: Total offenses per month.
    columns:
      - name: crime_month
        description: Month (first-of-month date).
      - name: incident_count
        description: Offenses reported that month.

  # ===== 311 / Customer service requests ====================================
  - name: mart_csr_by_department
    description: Request counts by responsible city department.
    columns:
      - name: department
        description: City department that owns the request.
      - name: request_count
        description: Requests routed to the department.

  - name: mart_csr_by_method
    description: How residents file requests (Find-It-Fix-It app vs. web vs. phone) — the digital-engagement story.
    columns:
      - name: method_received
        description: Intake channel.
      - name: request_count
        description: Requests received via the channel.

  - name: mart_csr_by_type
    description: Request counts by request type (illegal dumping, potholes, …).
    columns:
      - name: request_type
        description: Service-request type.
      - name: request_count
        description: Requests of the type.

  - name: mart_csr_monthly
    description: Total 311 requests per month.
    columns:
      - name: request_month
        description: Month (first-of-month date).
      - name: request_count
        description: Requests created that month.

  # ===== Ferry ridership (FTA NTD) ==========================================
  - name: mart_ferry_annual
    description: Annual ferry boardings; the partial current year is flagged via months_reported.
    columns:
      - name: ridership_year
        description: Calendar year.
      - name: boardings
        description: Total ferry boardings (UPT) for the year.
      - name: months_reported
        description: Months of data present — lets the view drop partial years.

  - name: mart_ferry_by_operator
    description: Ferry boardings by operator (Washington State Ferries vs. King County Water Taxi).
    columns:
      - name: operator
        description: Ferry operator.
      - name: boardings
        description: Total boardings (UPT).

  - name: mart_ferry_monthly
    description: Total monthly Puget Sound ferry boardings — summer seasonality plus the pandemic dip.
    columns:
      - name: ridership_month
        description: Month (first-of-month date).
      - name: boardings
        description: Total ferry boardings that month.

  - name: mart_ferry_seasonal
    description: Average ferry boardings by calendar month — the summer-tourism seasonality curve.
    columns:
      - name: month_of_year
        description: Calendar month number (1–12).
      - name: avg_boardings
        description: >
          Mean of monthly ferry boarding totals (sum of UPT over all ferry rows per
          month) for this calendar month across every loaded year (NTD data from
          2015-01-01), including pandemic years and any partial current-year month.

  # ===== Fire 911 dispatch ==================================================
  - name: mart_fire_by_hour_weekday
    description: Hour-of-day × weekday grid behind the fire-911 heatmap.
    columns:
      - name: weekday
        description: Day name.
      - name: hour_of_day
        description: >
          Hour 0–23 extracted from the source datetime as published (cast to a timezone-naive timestamp; no timezone conversion in code).
      - name: call_count
        description: Calls in that weekday/hour cell.

  - name: mart_fire_by_type
    description: Dispatch counts by call type (aid response, fire, …).
    columns:
      - name: call_type
        description: Dispatch call type.
      - name: call_count
        description: Calls of the type.

  - name: mart_fire_monthly
    description: Total fire-911 calls per month.
    columns:
      - name: call_month
        description: Month (first-of-month date).
      - name: call_count
        description: Calls dispatched that month.

  # ===== Food inspections (King County) =====================================
  - name: mart_inspections
    description: >
      One row per food inspection — collapses the one-row-per-violation staging
      rows. inspection_serial_num is the natural key here (unique by construction);
      the unique test guards the dedup.
    columns:
      - name: inspection_serial_num
        description: Inspection identifier (unique in this mart).
        data_tests:
          - not_null
          - unique
      - name: establishment
        description: Food establishment name.
      - name: inspection_date
        description: Date of the inspection.
      - name: inspection_result
        description: Overall result (Satisfactory / Unsatisfactory / Complete).
      - name: grade
        description: Public-facing grade band.
      - name: inspection_score
        description: Violation-points score (higher = worse).
      - name: violation_count
        description: Number of violations recorded in the inspection.

  - name: mart_inspection_results
    description: Inspection counts by overall result.
    columns:
      - name: inspection_result
        description: Overall inspection result.
      - name: inspection_count
        description: Inspections with that result.

  - name: mart_inspections_over_time
    description: Monthly inspection volume and average score.
    columns:
      - name: inspection_month
        description: Month (first-of-month date).
      - name: inspection_count
        description: Inspections that month.
      - name: avg_score
        description: Mean violation-points score (higher = worse).

  - name: mart_top_violations
    description: Most frequently cited violations across all inspections.
    columns:
      - name: violation_description
        description: Violation text.
      - name: violation_count
        description: Times the violation was cited.

  - name: mart_worst_establishments
    description: Establishments with the worst average score (≥3 inspections), worst first.
    columns:
      - name: establishment
        description: Establishment name.
      - name: inspections
        description: Number of inspections on record.
      - name: avg_score
        description: Mean violation-points score (higher = worse).
      - name: total_violations
        description: Sum of violations across inspections.

  # ===== Business licenses ==================================================
  - name: mart_licenses_by_city
    description: >
      Business-license counts by city; blanks rolled to 'Unknown'. No status filter in code: the loaded dataset (wnbq-64tb) is the city's active business-license certificate extract, so 'active' reflects that source, not a filter here.
    columns:
      - name: city
        description: City on the license.
      - name: license_count
        description: >
          Licenses in the city. No status filter in code: the loaded dataset (wnbq-64tb) is the city's active business-license certificate extract, so 'active' reflects that source, not a filter here.

  - name: mart_licenses_by_industry
    description: License counts by NAICS industry description.
    columns:
      - name: naics_description
        description: NAICS industry description.
      - name: license_count
        description: >
          Licenses in the industry. No status filter in code: the loaded dataset (wnbq-64tb) is the city's active business-license certificate extract, so 'active' reflects that source, not a filter here.

  - name: mart_licenses_by_ownership
    description: License counts by ownership type (sole proprietor, LLC, …).
    columns:
      - name: ownership_type
        description: Legal ownership type.
      - name: license_count
        description: >
          Licenses of that type. No status filter in code: the loaded dataset (wnbq-64tb) is the city's active business-license certificate extract, so 'active' reflects that source, not a filter here.

  - name: mart_licenses_monthly
    description: New-license starts per month (2005+).
    columns:
      - name: license_month
        description: Month (first-of-month date) the license started.
      - name: license_count
        description: Licenses started that month.

  # ===== Parks (ArcGIS) =====================================================
  - name: mart_parks_largest
    description: The 15 largest parks by acreage.
    columns:
      - name: name
        description: Park name.
      - name: area_acres
        description: Park area in acres.
      - name: is_water_name
        description: Name-derived flag for water-associated parks.

  - name: mart_parks_points
    description: One row per park for the map and browsable list.
    columns:
      - name: name
        description: Park name.
      - name: area_acres
        description: Park area in acres.
      - name: latitude
        description: Park point latitude.
      - name: longitude
        description: Park point longitude.
      - name: is_water_name
        description: Name-derived water-park flag.

  - name: mart_parks_size_bands
    description: Park counts by size band — mostly small neighborhood parks with a few flagships.
    columns:
      - name: size_band
        description: Size bucket label (Pocket … Flagship).
      - name: park_count
        description: Parks in the band.
      - name: sort_order
        description: 1–5 ordering key for the bands.

  # ===== Building permits (Seattle DCI) =====================================
  - name: mart_permits_by_class
    description: Permit counts and valuation by permit class.
    columns:
      - name: permit_class
        description: Permit class; blanks rolled to 'Unknown'.
      - name: permit_count
        description: Permits in the class.
      - name: total_valuation
        description: >
          Summed estimated project cost (USD; source estprojectcost).
      - name: avg_valuation
        description: >
          Mean estimated project cost per permit (USD; source estprojectcost).

  - name: mart_permits_map_sample
    description: 5k most recent geocoded permits for the map, clipped to the metro box.
    columns:
      - name: permit_number
        description: Permit number — traces back to a real staging permit.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_building_permits')
                field: permit_number
      - name: permit_class
        description: Permit class.
      - name: permit_type_desc
        description: Permit type description.
      - name: valuation
        description: >
          Estimated project cost (USD; source estprojectcost).
      - name: issue_date
        description: Date the permit was issued.
      - name: address
        description: Project address.
      - name: latitude
        description: Permit latitude (within the metro box).
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 47.0
                max_value: 48.5
      - name: longitude
        description: Permit longitude.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -122.6
                max_value: -121.5

  - name: mart_permits_monthly
    description: Permit issuance and valuation per month.
    columns:
      - name: issue_month
        description: Month (first-of-month date) permits were issued.
      - name: permit_count
        description: Permits issued that month.
      - name: total_valuation
        description: >
          Summed estimated project cost (USD; source estprojectcost).
      - name: avg_valuation
        description: >
          Mean estimated project cost per permit (USD; source estprojectcost).

  # ===== Water: regional river / tide / snow observations ===================
  - name: mart_river_observations
    description: >
      One row per gage-day of regional USGS streamflow (every active daily-discharge
      gage in the region's counties; Island & Kitsap have none). The Water page
      aggregates at query time — per-county headline gage for charts, all gages for
      the map. Carries county_fips + is_headline so filtering stays honest.
    columns:
      - name: obs_date
        description: Observation date.
      - name: site_no
        description: USGS gage id.
      - name: county_fips
        description: 5-digit county FIPS.
      - name: is_headline
        description: True for the county's longest-record gage.
      - name: discharge_cfs
        description: Daily mean discharge (cubic feet/second).
      - name: station_name
        description: Station name as published by the source.
      - name: county
        description: Region county name the station is assigned to.
      - name: latitude
        description: Station latitude (WGS84 decimal degrees).
      - name: longitude
        description: Station longitude (WGS84 decimal degrees).

  - name: mart_tides_observations
    description: >
      One row per station-month of regional NOAA tide datums (the five saltwater-front
      county gauges). Aggregated at query time; carries county_fips + is_headline.
    columns:
      - name: obs_month
        description: First day of the observation month.
      - name: station_id
        description: NOAA CO-OPS station id.
      - name: county_fips
        description: 5-digit county FIPS.
      - name: is_headline
        description: True for the county's headline gauge.
      - name: msl_ft
        description: >
          Monthly mean sea level (feet), fetched with datum=MSL, i.e. relative to the
          station's tidal-epoch MSL datum: near-zero anomalies, NOT elevations.
      - name: station_name
        description: Station name as published by the source.
      - name: county
        description: Region county name the station is assigned to.
      - name: latitude
        description: Station latitude (WGS84 decimal degrees).
      - name: longitude
        description: Station longitude (WGS84 decimal degrees).
      - name: year
        description: Calendar year of obs_month.
      - name: month
        description: Calendar month number (1–12) of obs_month.
      - name: mhhw_ft
        description: Monthly mean higher-high water (feet), relative to the station's tidal-epoch MSL datum (fetched with datum=MSL, units=english).
      - name: mllw_ft
        description: Monthly mean lower-low water (feet), relative to the station's tidal-epoch MSL datum.
      - name: range_ft
        description: Great-diurnal tidal range GT = MHHW − MLLW for the month (feet).
      - name: highest_ft
        description: Highest observed water level in the month (feet), relative to the station's MSL datum.
      - name: lowest_ft
        description: Lowest observed water level in the month (feet), relative to the station's MSL datum.

  - name: mart_snow_observations
    description: >
      One row per station-day of regional NRCS SNOTEL snowpack (mountainous counties;
      lowland Island/Kitsap/Thurston have none). Aggregated at query time; carries
      county_fips + is_headline.
    columns:
      - name: obs_date
        description: Observation date.
      - name: water_year
        description: Water year (Oct 1 – Sep 30, labeled by the ending year).
      - name: station_triplet
        description: NRCS SNOTEL station triplet.
      - name: county_fips
        description: 5-digit county FIPS.
      - name: is_headline
        description: True for the county's headline station.
      - name: swe_in
        description: Snow-water-equivalent (inches).
      - name: station_name
        description: Station name as published by the source.
      - name: county
        description: Region county name the station is assigned to.
      - name: latitude
        description: Station latitude (WGS84 decimal degrees).
      - name: longitude
        description: Station longitude (WGS84 decimal degrees).
      - name: snow_depth_in
        description: Daily snow depth (inches), NRCS SNOTEL element SNWD; distinct from swe_in (water content).

  # ===== Short-term rentals =================================================
  - name: mart_str_by_region
    description: STR-license counts by geographic region; blanks rolled to 'Unknown'.
    columns:
      - name: geographicregion
        description: Geographic region on the license.
      - name: license_count
        description: Licenses in the region.

  - name: mart_str_by_status
    description: STR-license counts by status (Active, Inactive, Expired, …).
    columns:
      - name: licensestatus
        description: License status.
      - name: license_count
        description: Licenses with that status.

  - name: mart_str_by_type
    description: STR-license counts by property type; blanks rolled to 'Unknown'.
    columns:
      - name: propertytype
        description: Property type.
      - name: license_count
        description: Licenses of the type.

  - name: mart_str_map
    description: Geocoded STR licenses for the map, clipped to the metro box.
    columns:
      - name: licenseid
        description: License id (not unique — a license recurs across renewals).
      - name: licensestatus
        description: License status.
      - name: propertytype
        description: Property type.
      - name: geographicregion
        description: Geographic region.
      - name: latitude
        description: Latitude (within the metro box).
      - name: longitude
        description: Longitude.

  # ===== Transit ridership (FTA NTD) ========================================
  - name: mart_transit_by_agency
    description: Land-transit boardings by agency (excludes ferries).
    columns:
      - name: agency_label
        description: Friendly agency name.
      - name: boardings
        description: Total boardings (UPT).

  - name: mart_transit_by_mode
    description: Land-transit boardings by mode (bus, light rail, …).
    columns:
      - name: mode_label
        description: Human-readable mode.
      - name: boardings
        description: Total boardings (UPT).

  - name: mart_transit_light_rail_monthly
    description: Sound Transit Link light rail monthly boardings — the clearest post-pandemic growth story.
    columns:
      - name: ridership_month
        description: Month (first-of-month date).
      - name: boardings
        description: Light-rail boardings that month.

  - name: mart_transit_monthly
    description: Total monthly boardings across all Puget Sound land-transit modes (excludes ferries).
    columns:
      - name: ridership_month
        description: Month (first-of-month date).
      - name: boardings
        description: Total land-transit boardings that month.

  # ===== Street trees (SDOT) ================================================
  - name: mart_trees_by_condition
    description: Tree counts by recorded condition; unassessed trees kept as 'Not assessed'.
    columns:
      - name: condition
        description: Recorded condition, or 'Not assessed'.
      - name: tree_count
        description: Trees in the bucket.

  - name: mart_trees_by_genus
    description: Tree counts by genus, most common first.
    columns:
      - name: genus
        description: Tree genus (name-derived).
      - name: tree_count
        description: Trees of the genus.

  - name: mart_trees_by_species
    description: Tree counts by scientific name.
    columns:
      - name: scientific_name
        description: Full scientific (binomial) name.
      - name: tree_count
        description: Trees of the species.

  - name: mart_trees_map_sample
    description: ~15k-row random sample of geolocated trees for the dot map, clipped to Seattle.
    columns:
      - name: scientific_name
        description: Species name.
      - name: genus
        description: Genus.
      - name: condition
        description: Recorded condition (often null).
      - name: is_heritage
        description: Heritage-tree flag.
      - name: latitude
        description: Latitude (within the Seattle box).
      - name: longitude
        description: Longitude.

  - name: mart_trees_planted_by_year
    description: Recorded planting year (1970+; only a portion of trees carry a date).
    columns:
      - name: plant_year
        description: Year the tree was planted.
      - name: tree_count
        description: Trees planted that year.

  - name: mart_trees_summary
    description: One-row headline summary for the tree KPI cards.
    columns:
      - name: total_trees
        description: Total inventoried trees.
      - name: distinct_species
        description: Distinct scientific names.
      - name: distinct_genera
        description: Distinct genera.
      - name: heritage_trees
        description: Count flagged heritage.
      - name: exceptional_trees
        description: Count flagged exceptional.

  # ===== Weather (NOAA GHCN-Daily, regional) ================================
  - name: mart_weather_observations
    description: >
      One row per station-day of regional weather across every temperature-reporting
      GHCN station in the ten-county region. Sea-Tac is station_id 'USW00024233'; the
      per-county is_headline station is the one with the most distinct years since
      2014 (ties go to the lowest station_id), so it is not guaranteed to be Sea-Tac. The Rain
      & Records page aggregates at query time — per-county headline station for
      charts, all stations for the map. Carries county_fips + is_headline so county
      filtering and station labeling stay honest.
    columns:
      - name: obs_date
        description: Observation date.
      - name: station_id
        description: GHCN station id.
      - name: county_fips
        description: 5-digit county FIPS.
      - name: is_headline
        description: True for the county's longest-record station.
      - name: precip_in
        description: >
          Daily precipitation (inches); null on days the station did not report, so
          annual sums undercount for stations with missing days.
      - name: tmax_f
        description: Daily high (°F).
      - name: tmin_f
        description: Daily low (°F).
      - name: station_name
        description: Station name as published by the source.
      - name: county
        description: Region county name the station is assigned to.
      - name: latitude
        description: Station latitude (WGS84 decimal degrees).
      - name: longitude
        description: Station longitude (WGS84 decimal degrees).
      - name: snow_in
        description: Daily snowfall (inches), GHCN element SNOW; null where the station does not report snow.
      - name: snow_depth_in
        description: Snow depth on the ground (inches), GHCN element SNWD; null where the station does not report it.

  # ===== Semantic layer =====================================================
  - name: mart_metrics
    description: >
      The semantic layer — one row per headline metric, GENERATED from metrics.yml
      by generate_metrics_model.py. Each metric is declared once (label, description,
      source mart, aggregate expression, unit); dbt builds/tests/documents it here and
      the Streamlit Overview reads values by name. Regenerate with
      `uv run python generate_metrics_model.py`.
    columns:
      - name: metric_name
        description: Stable metric key the app looks up (e.g. total_permits).
        data_tests:
          - not_null
          - unique
      - name: label
        description: Human-readable metric name for display.
      - name: description
        description: One-line definition of the metric.
      - name: unit
        description: Value unit — drives app formatting.
        data_tests:
          - accepted_values:
              arguments:
                values: ["count", "usd", "percent"]
      - name: value
        description: The computed metric value (cast to double).
        data_tests:
          - not_null

  - name: mart_build_info
    description: >
      Warehouse build metadata — the data-freshness surface. One row holding
      built_at (dbt run_started_at, frozen into the baked warehouse) and
      total_records (the nine grain counts the Overview headline reports, defined
      here once). The Overview page reads it for its "Warehouse built <date>"
      banner. Because production rebuilds the warehouse from scratch every deploy,
      built_at is an honest "data loaded" timestamp.
    columns:
      - name: built_at
        description: Timestamp this `dbt build` began — the warehouse's build/load time.
        data_tests:
          - not_null
          - unique
      - name: total_records
        description: Total records across the nine headline grain tables.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 3000000

  # ===== Neighborhood choropleths (SPD MCPP polygons) =======================
  # One row per MCPP neighborhood, incidents assigned by point-in-polygon and
  # normalized by area. Back the crime / fire 911 / 311 choropleth maps.
  - name: mart_crime_by_neighborhood
    description: >
      Offense count and per-square-mile density for each SPD MCPP neighborhood
      (offenses assigned by point-in-polygon). Drives the Crime choropleth.
    columns:
      - name: neighborhood
        description: MCPP neighborhood name (uppercase), one row each.
        data_tests:
          - not_null
          - unique
      - name: incident_count
        description: >
          All-time count of offenses in the warehouse (loader keeps report_date_time >= 2019-01-01;
          no date filter in the mart) whose coordinates fall inside the lat 47.0–48.5 /
          lon -122.6 to -121.5 box AND inside this neighborhood's polygon. Ungeolocated
          rows are excluded.
        data_tests:
          - not_null
      - name: incidents_per_sq_mile
        description: incident_count divided by the neighborhood's area in square miles.
      - name: area_sq_miles
        description: Neighborhood area (Shape__Area square feet / 27,878,400).
      - name: rings_json
        description: Polygon rings as JSON ([[[lon,lat],…],…]) for the map render.
      - name: precinct
        description: >
          SPD precinct the MCPP neighborhood belongs to, as published on the ArcGIS
          MCPP layer (short code, e.g. 'SW'; passed through unnormalized).
      - name: centroid_lon
        description: >
          Approximate neighborhood center longitude (WGS84 decimal degrees): the
          vertex average of the polygon's first ring, not a true area centroid.
          For label placement only.
      - name: centroid_lat
        description: >
          Approximate neighborhood center latitude (WGS84 decimal degrees): the
          vertex average of the polygon's first ring, not a true area centroid.
          For label placement only.

