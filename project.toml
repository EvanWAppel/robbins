# Drafted 2026-10-22 by a weekend-prep agent (not yet verified in robbins' own session).
# Format: ~/Documents/_system/docs/project-toml.md

[project]
name = "robbins"
group = "portfolio/geographic"
kind = "app"
status = "active"
repo = "EvanWAppel/robbins"
visibility = "public"
on_site = true              # enki data/projects.ts has a "robbins" card (live link = Railway origin)
verified = false

[deploy]
host = "railway"
services = ["robbins"]      # Railway project "robbins" (TASKS.md VS-08/DEPLOY-04); service name unverified
domain = "robbins.evanappel.me"   # serves a Railway Streamlit app (HTTP 200, 2026-10-22); DEPLOY-06 still open in TASKS.md
origin_urls_closed = false  # robbins-production.up.railway.app still serves (HTTP 200, 2026-10-22)

[auth]
scheme = "none"
access_list = ""
target = "unknown"

[data]
db = "duckdb"               # baked at Docker build time (build_warehouse.py + dbt build)

[demo]
status = "live"             # whole app is public
url = "https://robbins-production.up.railway.app/"
path = "/"

[keys]
paid = ["anthropic"]        # Ask Tiresias page (tiresias library) reads ANTHROPIC_API_KEY
isolated = "yes"            # dedicated "robbins" Anthropic workspace key, set on Railway; Evan confirmed not his personal key (2026-10-23)
spend_cap = "yes"           # $10/month workspace limit, email alert at $9 (2026-10-23)

[platform]
done = []

[commands]
setup = "uv sync --dev"
dev = "uv run streamlit run streamlit_app.py"
test = "uv run pytest"
lint = "uv run ruff check . && uv run ty check"

[meta]
description = "Seattle-metro open-data explorer (port of elvis)"
language = "python"
tags = ["portfolio"]

[fleet]                     # joined 2026-10-31 (_system D-051); also has the `fleet` topic
component = "robbins"
agents = ["claude", "codex"]
default_model = "sonnet"
default_branch = "main"
max_minutes = 45
