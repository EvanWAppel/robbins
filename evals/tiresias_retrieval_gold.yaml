version: 1
k: 3
min_recall: 0.85
cases:
  - query: building permit valuation by month
    expect_any: [mart_permits_monthly, mart_permits_by_class]
  - query: crime categories
    expect_any: [mart_crime_by_category]
  - query: crime by neighborhood
    expect_any: [mart_crime_by_neighborhood]
  - query: fire 911 calls by hour
    expect_any: [mart_fire_by_hour_weekday, mart_fire_by_type, mart_fire_monthly]
  - query: 311 customer service requests
    expect_any: [mart_csr_by_type, mart_csr_monthly, mart_csr_by_department]
  - query: business licenses by industry
    expect_any: [mart_licenses_by_industry, mart_licenses_by_city]
  - query: short-term rental licenses
    expect_any: [mart_str_by_type, mart_str_by_status, mart_str_by_region]
  - query: restaurant inspection violations
    expect_any: [mart_top_violations, mart_inspections, mart_worst_establishments]
  - query: street tree species
    expect_any: [mart_trees_by_species, mart_trees_summary, mart_trees_by_genus]
  - query: largest parks
    expect_any: [mart_parks_largest, mart_parks_points]
  - query: rainfall at Sea-Tac
    expect_any: [mart_weather_observations]
  - query: river discharge by county
    expect_any: [mart_river_observations]
  - query: snowpack snow water equivalent
    expect_any: [mart_snow_observations]
  - query: sea level at tide gauges
    expect_any: [mart_tides_observations]
  - query: air quality by county
    expect_any: [mart_air_observations, mart_air_sites, mart_air_monthly]
  - query: light rail ridership
    expect_any: [mart_transit_light_rail_monthly, mart_transit_by_mode]
  - query: ferry boardings
    expect_any: [mart_ferry_annual, mart_ferry_monthly, mart_ferry_by_operator]
