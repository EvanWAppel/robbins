[server]
# Railway runs the app headless behind its own proxy; the port/address are
# passed on the command line (see the Dockerfile CMD).
headless = true

[theme]
base = "light"
primaryColor = "#2f6285"
backgroundColor = "#f2f5f6"
secondaryBackgroundColor = "#e4ebed"
textColor = "#123141"
font = "sans-serif"
chartCategoricalColors = ["#2f6285", "#c1913f", "#4f88a6", "#b4503f", "#3f7d86", "#8fb3b5"]

[theme.sidebar]
backgroundColor = "#123141"
secondaryBackgroundColor = "#1f4a5e"
textColor = "#e4edf0"
primaryColor = "#cfe0e6"
